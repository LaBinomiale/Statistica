name: Keep Streamlit Apps Awake

on:
  schedule:
    # Esegue lo script ogni 4 ore
    - cron: '0 */4 * * *'
  workflow_dispatch: # Ti permette di avviarlo anche a mano per testarlo

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Awake Script
        env:
          URLS: ${{ secrets.URLS }}
        run: |
          python - << 'EOF'
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from webdriver_manager.chrome import ChromeDriverManager

          urls = [url.strip() for url in os.getenv("URLS", "").split(",") if url.strip()]
          
          if not urls:
              print("Nessun URL configurato nei Secrets!")
              exit(1)

          # Configura il browser invisibile (Headless Chrome)
          options = webdriver.ChromeOptions()
          options.add_argument("--headless")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          
          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)

          for url in urls:
              print(f"Visitando l'app: {url}")
              driver.get(url)
              
              try:
                  # Aspetta fino a 15 secondi che il pulsante "back up" appaia nella pagina
                  # Usiamo XPATH per ignorare maiuscole/minuscole e cercare il testo esatto di Streamlit
                  wait = WebDriverWait(driver, 15)
                  button = wait.until(EC.element_to_be_clickable((By.XPATH, "//button[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'back up')]")))
                  
                  # Clicca il pulsante
                  button.click()
                  print(f"Pulsante 'Wake up' cliccato con successo per {url}!")
                  time.sleep(10) # Attende che l'app si avvii
                  
              except Exception as e:
                  print(f"Nessun pulsante 'Wake up' trovato per {url}. L'app potrebbe essere già attiva o l'interfaccia è cambiata.")

          driver.quit()
          EOF
